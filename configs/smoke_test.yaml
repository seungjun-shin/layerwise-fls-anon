experiment:
  name: smoke_test
output:
  root: outputs
data:
  name: fake
  root: data
  num_classes: 10
  image_size: 32
  train_size: 64
  test_size: 32
  batch_size: 16
  num_workers: 0
  augment: false
  normalize: false
  return_clean_labels: true
label_noise:
  rate: 0.0
  seed: 0
model:
  name: small_cnn
  in_channels: 3
  num_classes: 10
  width: 8
  use_bn: true
fls:
  mode: global
  global:
    output_multiplier: 1.0
    lr_compensation: false
training:
  seed: 0
  device: cpu
  max_epochs: 1
  max_steps: 2
  optimizer: sgd
  lr: 0.01
  weight_decay: 0.0
  momentum: 0.9
  target_train_accuracy: null
  target_train_loss: null
diagnostics:
  enabled: true
  frequency_epochs: 1
  groups: [early, middle, late, head]

