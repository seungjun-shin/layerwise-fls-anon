experiment:
  name: imp_vgg_late
output:
  root: outputs
data:
  name: cifar100
  root: data
  num_classes: 100
  image_size: 32
  batch_size: 128
  num_workers: 2
  augment: false
  normalize: true
  return_clean_labels: true
label_noise:
  rate: 0.0
  seed: 0
model:
  name: vgg19_bn_cifar
  in_channels: 3
  num_classes: 100
  width: 64
  use_bn: true
fls:
  mode: blockwise
  profile_name: null
  groups:
    early: {output_multiplier: 1.0, init_scale: 1.0}
    middle: {output_multiplier: 1.0, init_scale: 1.0}
    late: {output_multiplier: 0.0625, init_scale: 1.0}
    head: {output_multiplier: 1.0, init_scale: 1.0}
training:
  seed: 0
  device: auto
  max_epochs: 80
  max_steps: null
  optimizer: sgd
  lr: 0.04096
  blockwise_lr_compensation: upstream_cumulative
  weight_decay: 0.0
  momentum: 0.0
  save_checkpoints: true
diagnostics:
  enabled: false
  frequency_epochs: 10
  regions: [early, middle, late, head]
