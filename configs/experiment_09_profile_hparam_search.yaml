experiment:
  name: experiment_09_profile_hparam_search
output:
  root: outputs
data:
  name: cifar100
  root: data
  num_classes: 100
  image_size: 32
  batch_size: 128
  num_workers: 2
  augment: false
  normalize: true
  return_clean_labels: true
label_noise: {rate: 0.0, seed: 0}
model:
  name: resnet18_cifar
  in_channels: 3
  num_classes: 100
  width: 64
  use_bn: true
fls:
  mode: blockwise
  profile_name: progressive_increasing
  base_values:
    weak: 4.0
    optimal: 1.0
    strong: 0.25
training:
  seed: 0
  device: auto
  max_epochs: 80
  max_steps: null
  optimizer: sgd
  lr: 0.04096
  weight_decay: 0.0
  momentum: 0.0
diagnostics:
  enabled: false
  frequency_epochs: 10
  groups: [early, middle, late, head]
sweep:
  seeds: [0]
  learning_rates: [0.02048, 0.04096, 0.08192, 0.16384]
  profiles: [uniform_optimal, uniform_same_average, progressive_increasing, progressive_decreasing, random, shuffled_progressive]
  profile_base_values:
    - {weak: 2.0, optimal: 1.0, strong: 0.5}
    - {weak: 4.0, optimal: 1.0, strong: 0.25}
    - {weak: 8.0, optimal: 1.0, strong: 0.125}
    - {weak: 4.0, optimal: 0.5, strong: 0.125}
    - {weak: 2.0, optimal: 0.5, strong: 0.125}
    - {weak: 8.0, optimal: 2.0, strong: 0.25}
