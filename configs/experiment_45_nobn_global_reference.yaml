experiment:
  name: experiment_45_nobn_global_reference
output:
  root: outputs
data:
  name: cifar100
  root: data
  num_classes: 100
  image_size: 32
  batch_size: 128
  num_workers: 2
  augment: false
  normalize: true
  return_clean_labels: true
label_noise:
  rate: 0.0
  seed: 0
model:
  name: resnet18_cifar
  in_channels: 3
  num_classes: 100
  width: 64
  use_bn: false
fls:
  mode: global
  global:
    output_multiplier: 1.0
    lr_compensation: true
training:
  seed: 0
  device: auto
  max_epochs: 80
  max_steps: null
  optimizer: sgd
  lr: 0.04096
  weight_decay: 0.0
  momentum: 0.0
diagnostics:
  enabled: false
  frequency_epochs: 10
  regions: [early, middle, late, head]
sweep:
  seeds: [0, 1, 2]
  learning_rates: [0.04096, 0.08192, 0.16384, 0.32768]
  global_output_multipliers: [0.125, 0.25, 0.5, 1.0, 2.0, 4.0]
  skip_completed: true
  continue_on_error: true
