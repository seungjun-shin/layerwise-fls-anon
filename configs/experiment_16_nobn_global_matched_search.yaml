experiment:
  name: experiment_16_nobn_global_matched_search
output:
  root: outputs
data:
  name: cifar100
  root: data
  num_classes: 100
  image_size: 32
  batch_size: 128
  num_workers: 2
  augment: false
  normalize: true
  return_clean_labels: true
