training:
  seed: 0
  device: auto
  max_epochs: 80
  max_steps: null
  optimizer: sgd
  lr: 0.04096
  weight_decay: 0.0
  momentum: 0.0
diagnostics:
  enabled: true
  frequency_epochs: 10
  groups: [early, middle, late, head]
sweep:
  seeds: [0]
  learning_rates: [0.04096, 0.08192, 0.16384]
  global_output_multipliers: [0.25, 0.5, 1.0]
