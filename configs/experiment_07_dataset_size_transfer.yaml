experiment:
  name: experiment_07_dataset_size_transfer
output:
  root: outputs
data:
  name: cifar100
  root: data
  num_classes: 100
  image_size: 32
  batch_size: 128
  num_workers: 2
  augment: false
  normalize: true
  return_clean_labels: true
  train_subset_fraction: 0.25
  subset_seed: 0
label_noise:
  rate: 0.0
  seed: 0
model:
  name: resnet18_cifar
  in_channels: 3
  num_classes: 100
  width: 64
  use_bn: true
fls:
  mode: blockwise
  profile_name: progressive_increasing
  base_values:
    weak: 4.0
    optimal: 1.0
    strong: 0.25
training:
  seed: 0
  device: auto
  max_epochs: 80
  max_steps: null
  optimizer: sgd
  lr: 0.00064
  weight_decay: 0.0
  momentum: 0.0
diagnostics:
  enabled: true
  frequency_epochs: 5
  groups: [early, middle, late, head]
sweep:
  seeds: [0, 1, 2]
  profiles: [uniform_optimal, uniform_same_average, progressive_increasing, progressive_decreasing, random, shuffled_progressive]
  train_subset_fractions: [0.1, 0.25, 0.5]
