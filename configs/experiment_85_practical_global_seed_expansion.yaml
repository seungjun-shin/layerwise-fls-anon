experiment:
  name: experiment_85_practical_global_seed_expansion
output:
  root: outputs
data:
  name: cifar100
  root: data
  num_classes: 100
  image_size: 32
  batch_size: 128
  num_workers: 2
  augment: true
  normalize: true
  return_clean_labels: true
label_noise:
  rate: 0.0
  seed: 0
model:
  name: resnet18_cifar
  in_channels: 3
  num_classes: 100
  width: 64
  use_bn: true
fls:
  mode: global
  global:
    output_multiplier: 1.0
    lr_compensation: true
training:
  seed: 1
  device: auto
  max_epochs: 80
  max_steps: null
  optimizer: sgd
  lr: 0.00384
  weight_decay: 0.0005
  momentum: 0.9
  save_checkpoints: true
diagnostics:
  enabled: false
  frequency_epochs: 10
  regions: [early, middle, late, head]
sweep:
  seeds: [1, 2, 3, 4]
  learning_rates: [0.00384]
  global_output_multipliers: [1.0, 1.25]
  skip_completed: true
  continue_on_error: true
