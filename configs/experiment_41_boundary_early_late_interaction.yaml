experiment:
  name: experiment_41_boundary_early_late_interaction
output:
  root: outputs
data:
  name: cifar100
  root: data
  num_classes: 100
  image_size: 32
  batch_size: 128
  num_workers: 2
  augment: false
  normalize: true
  return_clean_labels: true
label_noise:
  rate: 0.0
  seed: 0
model:
  name: resnet18_cifar
  in_channels: 3
  num_classes: 100
  width: 64
  use_bn: true
fls:
  mode: location
  boundaries:
    after_early: {output_multiplier: 1.0, init_scale: 1.0}
    after_middle: {output_multiplier: 1.0, init_scale: 1.0}
    after_late: {output_multiplier: 1.0, init_scale: 1.0}
training:
  seed: 0
  device: auto
  max_epochs: 80
  max_steps: null
  optimizer: sgd
  lr: 0.04096
  location_lr_compensation: upstream
  weight_decay: 0.0
  momentum: 0.0
diagnostics:
  enabled: false
  frequency_epochs: 10
  regions: [early, middle, late, head]
sweep:
  seeds: [0]
  learning_rates: [0.04096]
  interaction_boundaries:
    - [after_early, after_late]
  interaction_values:
    after_early: [1.0, 2.0, 4.0]
    after_late: [0.03125, 0.0625, 0.125, 0.25]
  fixed_output_multiplier: 1.0
  skip_completed: true
  continue_on_error: true
