experiment:
  name: experiment_06_fixed_lr_ablation
output:
  root: outputs
data:
  name: cifar100
  root: data
  num_classes: 100
  image_size: 32
  batch_size: 128
  num_workers: 2
  augment: false
  normalize: true
  return_clean_labels: true
label_noise:
  rate: 0.0
  seed: 0
model:
  name: resnet18_cifar
  in_channels: 3
  num_classes: 100
  width: 64
  use_bn: true
fls:
  mode: global
  global:
    output_multiplier: 1.0
    lr_compensation: false
training:
  seed: 0
  device: auto
  max_epochs: 80
  max_steps: null
  optimizer: sgd
  lr: 0.00064
  weight_decay: 0.0
  momentum: 0.0
diagnostics:
  enabled: true
  frequency_epochs: 5
  groups: [early, middle, late, head]
sweep:
  seeds: [0, 1, 2]
  global_output_multipliers: [0.25, 1.0, 4.0]
  learning_rates: [0.00064]
