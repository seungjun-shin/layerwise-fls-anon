experiment:
  name: experiment_02_label_noise_alignment
output:
  root: outputs
data:
  name: cifar100
  root: data
  num_classes: 100
  image_size: 32
  batch_size: 128
  num_workers: 2
  augment: false
  normalize: true
  return_clean_labels: true
label_noise:
  rate: 0.2
  seed: 0
model:
  name: resnet18_cifar
  in_channels: 3
  num_classes: 100
  width: 64
  use_bn: true
fls:
  mode: global
  global: {output_multiplier: 1.0, lr_compensation: true}
training:
  seed: 0
  device: auto
  max_epochs: 80
  max_steps: null
  optimizer: sgd
  lr: 0.00064
  weight_decay: 0.0
  momentum: 0.0
diagnostics:
  enabled: true
  frequency_epochs: 5
  groups: [early, middle, late, head]
  clean_noisy_alignment: true
sweep:
  seeds: [0, 1, 2]
  label_noise_rates: [0.0, 0.2, 0.5]
  profiles: [uniform_weak, uniform_optimal, uniform_strong, progressive_increasing, progressive_decreasing, random, shuffled_progressive]
