experiment:
  name: experiment_44_cifar10_boundary_sensitivity
output:
  root: outputs
data:
  name: cifar10
  root: data
  num_classes: 10
  image_size: 32
  batch_size: 128
  num_workers: 2
  augment: false
  normalize: true
  return_clean_labels: true
label_noise:
  rate: 0.0
  seed: 0
model:
  name: resnet18_cifar
  in_channels: 3
  num_classes: 10
  width: 64
  use_bn: true
fls:
  mode: location
  boundaries:
    after_early: {output_multiplier: 1.0, init_scale: 1.0}
    after_middle: {output_multiplier: 1.0, init_scale: 1.0}
    after_late: {output_multiplier: 1.0, init_scale: 1.0}
training:
  seed: 0
  device: auto
  max_epochs: 80
  max_steps: null
  optimizer: sgd
  lr: 0.04096
  location_lr_compensation: upstream
  weight_decay: 0.0
  momentum: 0.0
diagnostics:
  enabled: false
  frequency_epochs: 10
  regions: [early, middle, late, head]
sweep:
  seeds: [0, 1, 2]
  learning_rates: [0.00256, 0.01024, 0.04096, 0.08192, 0.16384]
  varied_boundaries: [after_late]
  output_multipliers: [0.0009765625, 0.001953125, 0.00390625, 0.0078125, 0.015625, 0.03125, 0.0625, 0.125, 0.25]
  fixed_output_multiplier: 1.0
  skip_completed: true
  continue_on_error: true
