experiment:
  name: experiment_69_practical_factor_momentum_only_global
output: {root: outputs}
data:
  name: cifar100
  root: data
  num_classes: 100
  image_size: 32
  batch_size: 128
  num_workers: 2
  augment: false
  normalize: true
  return_clean_labels: true
label_noise: {rate: 0.0, seed: 0}
model:
  name: resnet18_cifar
  in_channels: 3
  num_classes: 100
  width: 64
  use_bn: true
fls:
  mode: global
  global: {output_multiplier: 0.25, lr_compensation: true}
training:
  seed: 0
  device: auto
  max_epochs: 80
  max_steps: null
  optimizer: sgd
  lr: 0.00256
  weight_decay: 0.0
  momentum: 0.9
  save_checkpoints: false
diagnostics: {enabled: false, frequency_epochs: 10, regions: [early, middle, late, head]}
sweep:
  seeds: [0, 1, 2]
  learning_rates: [0.00256]
  global_output_multipliers: [0.25]
  skip_completed: true
  continue_on_error: true
