# n=5 persistence extension — GLOBAL reference. Faithful reproduction of
# experiment_93_persist_global_c0p25 (augment + cosine on top of the controlled
# setting; momentum 0, weight decay 0, lr 0.04096, global c=0.25). Seeds 3-4 only,
# to extend the existing n=3 (seeds 0-2) to n=5. experiment.name is kept canonical
# so outputs merge with the existing runs for diagnostics + aggregation.
experiment:
  name: experiment_93_persist_global_c0p25
output:
  root: outputs
data:
  name: cifar100
  root: data
  num_classes: 100
  image_size: 32
  batch_size: 128
  num_workers: 2
  augment: true
  normalize: true
  return_clean_labels: true
label_noise:
  rate: 0.0
  seed: 0
model:
  name: resnet18_cifar
  in_channels: 3
  num_classes: 100
  width: 64
  use_bn: true
fls:
  mode: global
  global:
    output_multiplier: 0.25
    lr_compensation: true
training:
  seed: 0            # overridden per job (3, 4)
  device: auto
  max_epochs: 80
  max_steps: null
  optimizer: sgd
  lr: 0.04096
  weight_decay: 0.0
  momentum: 0.0
  lr_scheduler: cosine
  save_checkpoints: true
diagnostics:
  enabled: false
  frequency_epochs: 10
  regions: [early, middle, late, head]
