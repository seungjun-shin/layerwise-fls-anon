experiment:
  name: experiment_32_cifar10_late_boundary_refinement
output:
  root: outputs
data:
  name: cifar10
  root: data
  num_classes: 10
  image_size: 32
  batch_size: 128
  num_workers: 2
  augment: false
  normalize: true
  return_clean_labels: true
label_noise:
  rate: 0.0
  seed: 0
model:
  name: resnet18_cifar
  in_channels: 3
  num_classes: 10
  width: 64
  use_bn: true
fls:
  mode: blockwise
  profile_name: null
  groups:
    early: {output_multiplier: 1.0, init_scale: 1.0}
    middle: {output_multiplier: 1.0, init_scale: 1.0}
    late: {output_multiplier: 1.0, init_scale: 1.0}
    head: {output_multiplier: 1.0, init_scale: 1.0}
training:
  seed: 0
  device: auto
  max_epochs: 80
  max_steps: null
  optimizer: sgd
  lr: 0.04096
  blockwise_lr_compensation: upstream_cumulative
  weight_decay: 0.0
  momentum: 0.0
diagnostics:
  enabled: false
  frequency_epochs: 10
  groups: [early, middle, late, head]
sweep:
  seeds: [0, 1, 2]
  learning_rates: [0.04096, 0.08192, 0.16384]
  varied_groups: [late]
  output_multipliers: [0.0009765625, 0.001953125, 0.00390625, 0.0078125]
  fixed_output_multiplier: 1.0
